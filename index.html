<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#0b041c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hrry TV – Live TV From Around The World</title>
<meta name="description" content="Hrry TV – watch live TV channels from every country in 16:9 HD.">
<link rel="icon" href="https://i.ibb.co/RG9PVntv/file-000000006df082088ecfb45a4b842781.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/RG9PVntv/file-000000006df082088ecfb45a4b842781.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:"Plus Jakarta Sans",-apple-system,Roboto,sans-serif;color:#fff;background:#090316 radial-gradient(circle at 10% 5%,rgba(255,0,127,.22),transparent 45%),radial-gradient(circle at 90% 10%,rgba(0,210,255,.22),transparent 45%),linear-gradient(180deg,#0b041c,#110629 50%,#080214);background-attachment:fixed;overflow-x:hidden;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
@keyframes sp{to{transform:rotate(360deg)}}
header,main{max-width:1060px;margin:0 auto;padding:12px 14px 6px}
header{position:sticky;top:0;z-index:100}
.island{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,rgba(32,12,64,.94),rgba(14,22,56,.94));border:1.5px solid rgba(255,255,255,.22);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:11px;object-fit:cover;border:1.5px solid #00f5d4}
.grad{background:linear-gradient(90deg,#ffbe0b,#ff007f,#00f5d4,#00bbf9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand b{font-size:17px;font-weight:800;letter-spacing:.4px}
#count{font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:999px;color:#042f2e;background:linear-gradient(135deg,#00f59b,#00d2ff)}
.player-wrap,.tools{display:none;margin-bottom:12px}
.player-wrap.on{display:block}.tools.on{display:flex}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;border:2px solid rgba(0,245,212,.55);box-shadow:0 12px 30px rgba(0,0,0,.55)}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#wm{position:absolute;z-index:2;right:12px;top:12px;width:clamp(28px,4.5vw,42px);opacity:.65;pointer-events:none}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:rgba(9,3,22,.88);z-index:3}
.ov.show{display:flex}.ov p{color:#e2e8f0;font-size:13px}
.spin{width:38px;height:38px;border:3.5px solid rgba(255,255,255,.15);border-top-color:#ff007f;border-right-color:#00f5d4;border-radius:50%;animation:sp .75s linear infinite}
.tools{flex-direction:column;gap:10px;padding:14px 16px;border-radius:20px;background:linear-gradient(145deg,rgba(38,16,72,.9),rgba(16,22,54,.9));border:1.5px solid rgba(255,255,255,.2)}
.tools h1{font-size:clamp(16px,3.5vw,20px);font-weight:800;background:linear-gradient(90deg,#fff,#ffbe0b,#00f5d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:99px;background:linear-gradient(135deg,#ff0055,#ff7700)}
.badge i{width:6px;height:6px;border-radius:50%;background:#00ff87}
.pill{border:1px solid rgba(255,255,255,.26);background:linear-gradient(135deg,rgba(0,187,249,.3),rgba(131,56,236,.35));color:#fff;font:800 12px inherit;font-family:inherit;padding:6px 13px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill:active{transform:scale(.96)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 14px;padding:12px 15px;border-radius:18px;background:linear-gradient(90deg,rgba(255,0,127,.25),rgba(131,56,236,.25),rgba(0,187,249,.25));border:1px solid rgba(255,255,255,.22)}
.bar h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.bar h2 i{color:#ffbe0b}
.bar input,.bar select{background:rgba(9,3,22,.75);border:1px solid rgba(255,255,255,.24);color:#fff;font:600 13px inherit;font-family:inherit;padding:9px 13px;border-radius:12px;outline:none}
.bar input{flex:1;min-width:150px;max-width:280px;margin-left:auto}
.bar select{max-width:190px}.bar select option{background:#110629}
.bar input:focus{border-color:#00f5d4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{padding:14px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:12px;border:1.5px solid;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .18s}
.card:active{transform:scale(.98)}
.t0{background:linear-gradient(145deg,rgba(70,15,60,.92),rgba(28,12,54,.95));border-color:rgba(255,0,127,.45)}
.t1{background:linear-gradient(145deg,rgba(10,55,52,.92),rgba(12,28,54,.95));border-color:rgba(0,245,155,.45)}
.t2{background:linear-gradient(145deg,rgba(68,36,12,.92),rgba(48,12,38,.95));border-color:rgba(255,190,11,.45)}
.t3{background:linear-gradient(145deg,rgba(14,42,68,.92),rgba(32,16,60,.95));border-color:rgba(0,210,255,.45)}
.card.sel{border:2px solid #00f5d4;box-shadow:0 0 18px rgba(0,245,212,.28)}
.logo{flex:none;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.info{flex:1;min-width:0}
.info h3{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{color:#cbd5e1;font-size:12px}
.fav{background:none;border:0;color:#cbd5e1;font-size:18px;cursor:pointer;padding:6px}
.fav.on{color:#ff007f}
.empty{grid-column:1/-1;text-align:center;padding:36px 16px;border:1.5px dashed rgba(255,255,255,.25);border-radius:20px;background:rgba(25,10,48,.8)}
.empty b{display:block;font-size:17px;margin-bottom:6px;color:#ffbe0b}
.sk{height:80px;border-radius:20px;background:rgba(255,255,255,.07)}
</style></head><body>
<header><div class="island">
  <div class="brand"><img src="https://i.ibb.co/RG9PVntv/file-000000006df082088ecfb45a4b842781.png" alt="Hrry TV"><b class="grad">HRRY TV</b></div>
  <span id="count">Loading…</span>
</div></header>
<main>
  <section class="player-wrap" id="pw"><div class="player">
    <video id="v" controls playsinline webkit-playsinline preload="none"></video>
    <img id="wm" src="https://i.ibb.co/RG9PVntv/file-000000006df082088ecfb45a4b842781.png" alt="">
    <div class="ov" id="ov"></div>
  </div></section>
  <section class="tools" id="tools"></section>
  <div class="bar">
    <h2><i class="fas fa-tv"></i> Live Channels</h2>
    <select id="cty" aria-label="Country"></select>
    <button class="pill" id="favBtn"><i class="fas fa-heart"></i> Favorites</button>
    <input id="q" type="search" placeholder="Search channels…">
  </div>
  <section class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></section>
</main>
<script>
(()=>{
const $=i=>document.getElementById(i),v=$('v'),ov=$('ov'),grid=$('grid'),cty=$('cty');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(_){}}};
let list=[],cur=null,hls=null,favs=ls.get('hrry_favs',[]),onlyFav=false,code=ls.get('hrry_cc','IN');
const api=async p=>{const r=await fetch(p);if(!r.ok)throw 0;return r.json()};
const fk=c=>c.n+'|'+code;

function overlay(h){ov.innerHTML=h;ov.classList.toggle('show',!!h)}
function play(c){
  cur=c;$('pw').classList.add('on');$('tools').classList.add('on');
  overlay('<div class="spin"></div><p>Loading stream…</p>');
  if(hls){hls.destroy();hls=null}
  const ok=()=>{overlay('');v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})})};
  const fail=()=>overlay('<p><b>Stream unavailable</b><br>Try another channel or reload.</p>');
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({lowLatencyMode:true});hls.loadSource(c.u);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,ok);
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)fail()});
  }else{v.src=c.u;v.onloadedmetadata=ok;v.onerror=fail}
  $('tools').innerHTML=`<div class="row" style="justify-content:space-between"><h1>${esc(c.n)}</h1><span class="badge"><i></i>LIVE</span></div>
  <div class="row"><button class="pill" id="rl"><i class="fas fa-rotate"></i> Reload</button><button class="pill" id="fs"><i class="fas fa-expand"></i> Fullscreen</button></div>`;
  $('rl').onclick=()=>play(cur);
  $('fs').onclick=()=>{const e=v.parentElement;(e.requestFullscreen||v.webkitEnterFullscreen||(()=>{})).call(e.requestFullscreen?e:v)};
  render();window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const a=list.filter(c=>(!onlyFav||favs.includes(fk(c)))&&(!q||(c.n+' '+c.g).toLowerCase().includes(q)));
  $('count').textContent=a.length+' Channels';
  if(!a.length){grid.innerHTML='<div class="empty"><b>No channels found</b>Try another search or country.</div>';return}
  grid.innerHTML=a.map((c,i)=>{const f=favs.includes(fk(c));
    return `<div class="card t${i%4}${cur&&cur.u===c.u?' sel':''}" data-i="${list.indexOf(c)}">
    <div class="logo">${c.l?`<img loading="lazy" src="${esc(c.l)}" alt="" onerror="this.remove()">`:'<i class="fas fa-tv"></i>'}</div>
    <div class="info"><h3>${esc(c.n)}</h3><small>${esc(c.g)}</small></div>
    <button class="fav${f?' on':''}" data-f="${list.indexOf(c)}" aria-label="Favorite"><i class="fa${f?'s':'r'} fa-heart"></i></button></div>`}).join('');
}
grid.onclick=e=>{
  const f=e.target.closest('[data-f]');
  if(f){const c=list[f.dataset.f],k=fk(c);favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];ls.set('hrry_favs',favs);render();return}
  const d=e.target.closest('[data-i]');if(d)play(list[d.dataset.i]);
};
async function load(){
  grid.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try{list=await api('/api/channels?c='+encodeURIComponent(code))}catch(_){list=[]}
  render();
}
$('q').oninput=render;
$('favBtn').onclick=function(){onlyFav=!onlyFav;this.style.background=onlyFav?'linear-gradient(135deg,#ff007f,#8338ec)':'';render()};
cty.onchange=()=>{code=cty.value;ls.set('hrry_cc',code);load()};
(async()=>{
  try{const cs=await api('/api/countries');
    cty.innerHTML=cs.sort((a,b)=>a.n.localeCompare(b.n)).map(c=>`<option value="${esc(c.c)}"${c.c===code?' selected':''}>${esc(c.f||'')} ${esc(c.n)}</option>`).join('')}catch(_){}
  load();
})();
})();
</script></body></html>
