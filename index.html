<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#0b041c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hrry TV – Live TV From Around The World</title>
<meta name="description" content="Hrry TV – watch live TV channels from every country in HD.">
<link rel="icon" href="https://i.ibb.co/RG9PVntv/file-000000006df082088ecfb45a4b842781.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/RG9PVntv/file-000000006df082088ecfb45a4b842781.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
/* Light & smooth: no backdrop-blur, no infinite animations, no fixed-attachment backgrounds */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:"Plus Jakarta Sans",-apple-system,Roboto,sans-serif;color:#fff;background:#0b041c;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 8% 10%,rgba(255,0,128,.3),transparent 40%),radial-gradient(circle at 92% 12%,rgba(0,229,255,.3),transparent 42%),radial-gradient(circle at 88% 80%,rgba(255,165,0,.2),transparent 42%),radial-gradient(circle at 12% 86%,rgba(0,255,149,.22),transparent 42%),linear-gradient(155deg,#09021a,#150534 50%,#070317)}
@keyframes sp{to{transform:rotate(360deg)}}
header,main,.promo{max-width:1120px;margin:0 auto;padding-left:14px;padding-right:14px}
header{padding-top:12px;padding-bottom:6px}
.island{padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,#230c44,#0e1638);border:1.5px solid rgba(255,255,255,.26);box-shadow:0 6px 18px rgba(255,0,127,.25);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand img{width:36px;height:36px;border-radius:11px;object-fit:cover;border:2px solid #00f5d4}
.rbt{font-size:18px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ff007f,#ffbe0b,#00f5d4,#00bbf9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#count{font-size:11.5px;font-weight:800;padding:6px 13px;border-radius:999px;color:#052e16;background:linear-gradient(135deg,#00f59b,#00d2ff)}
.promo div{padding:9px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(255,0,127,.3),rgba(255,190,11,.22),rgba(0,245,212,.22),rgba(131,56,236,.3));border:1px solid rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;text-align:center;font-size:12px;font-weight:700}
.promo span:first-child{padding:3px 10px;border-radius:999px;background:linear-gradient(135deg,#ff007f,#ff7700);font-size:10px;font-weight:800;text-transform:uppercase}
main{padding-top:10px}
/* ---- sticky fixed 16:9 player ---- */
.pwrap{display:none;position:sticky;top:0;z-index:90;padding:calc(8px + env(safe-area-inset-top)) 0 8px;background:#0b041c;transform:translateZ(0)}
.pwrap.on{display:block}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:2px solid rgba(0,245,212,.55);contain:layout paint}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#wm{position:absolute;z-index:2;right:10px;top:10px;width:clamp(26px,4.5vw,40px);opacity:.6;pointer-events:none}
.um{position:absolute;z-index:4;left:10px;top:10px;display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:linear-gradient(135deg,#ff007f,#ff7700);color:#fff;font:800 11.5px inherit;font-family:inherit;cursor:pointer}
.um.show{display:inline-flex}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:rgba(9,3,22,.92);z-index:3}
.ov.show{display:flex}
.ov b{font-size:15px;font-weight:800;background:linear-gradient(90deg,#ffbe0b,#ff007f,#00f5d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ov p{color:#e2e8f0;font-size:13px}
.spin{width:38px;height:38px;border:3.5px solid rgba(255,255,255,.15);border-top-color:#ff007f;border-right-color:#00f5d4;border-radius:50%;animation:sp .75s linear infinite}
/* ---- tools box (separate, below player) ---- */
.tools{margin-top:8px;padding:9px 12px;border-radius:16px;background:linear-gradient(145deg,#260f48,#101636);border:1.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.tt{min-width:0;display:flex;flex-direction:column;gap:3px}
#np{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#fff,#ffbe0b,#00f5d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#70e6ff}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.6px;padding:3px 9px;border-radius:99px;background:linear-gradient(135deg,#ff0055,#ff7700);color:#fff}
.badge i{width:6px;height:6px;border-radius:50%;background:#00ff87}
.acts{display:flex;gap:6px;flex:none}
.pc{border:1px solid rgba(255,255,255,.28);background:linear-gradient(135deg,rgba(255,0,127,.5),rgba(131,56,236,.5));color:#fff;font:800 11.5px inherit;font-family:inherit;padding:7px 11px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pc:active{transform:scale(.95)}
/* ---- bars & cards ---- */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 12px;padding:11px 14px;border-radius:18px;background:linear-gradient(90deg,rgba(255,0,127,.3),rgba(131,56,236,.3),rgba(0,187,249,.3));border:1px solid rgba(255,255,255,.24)}
.bar h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#fff,#ffbe0b,#00f5d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bar h2 i{-webkit-text-fill-color:initial;color:#ffbe0b}
.bar h2 img{-webkit-text-fill-color:initial;width:30px;height:20px;border-radius:4px;object-fit:cover}
.bar .pc{margin-left:auto}
.bar input{margin-left:auto;flex:1;min-width:150px;max-width:290px;background:rgba(10,4,26,.8);border:1.5px solid rgba(255,255,255,.25);color:#fff;font:600 13px inherit;font-family:inherit;padding:9px 13px;border-radius:13px;outline:none}
.bar input:focus{border-color:#00f5d4}
.bar input::placeholder{color:#cbd5e1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{content-visibility:auto;contain-intrinsic-size:auto 150px;padding:16px;border-radius:22px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:11px;border:1.5px solid;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.theme-0{background:linear-gradient(145deg,#4a1448,#241040);border-color:rgba(255,0,127,.5)}
.theme-1{background:linear-gradient(145deg,#0a4a40,#0e2440);border-color:rgba(0,245,155,.5)}
.theme-2{background:linear-gradient(145deg,#5a3010,#3c1034);border-color:rgba(255,190,11,.5)}
.theme-3{background:linear-gradient(145deg,#0e3a5a,#281450);border-color:rgba(0,210,255,.5)}
.card:active{transform:scale(.98)}
.card.sel{border:2px solid #00f5d4;box-shadow:0 0 16px rgba(0,245,212,.35)}
@media(hover:hover){.card:hover{transform:translateY(-3px)}}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);color:#ffbe0b}
.cmain{display:flex;align-items:center;gap:11px;min-width:0}
.cmain>div{min-width:0;flex:1}
.flag{flex:none;width:66px;height:44px;border-radius:9px;object-fit:cover;border:1.5px solid rgba(255,255,255,.35)}
.logo{flex:none;width:50px;height:50px;border-radius:13px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.card h3{font-size:15.5px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{color:#e2e8f0;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv{flex:none;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.22);color:#fff;width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer}
.fv.on{color:#ff007f;border-color:#ff007f}
.btn{width:100%;background:linear-gradient(135deg,#ff007f,#ff7700 50%,#8338ec);color:#fff;border:1px solid rgba(255,255,255,.4);font:800 13px inherit;font-family:inherit;padding:10px 14px;border-radius:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.card.sel .btn{background:linear-gradient(135deg,#00f59b,#00bbf9);color:#042f2e}
.btn:active{transform:scale(.97)}
.more{max-width:440px;margin:26px auto 0;display:flex;font-size:15px;padding:14px}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;border:1.5px dashed rgba(255,255,255,.3);border-radius:22px;background:rgba(255,0,127,.1);color:#e2e8f0}
.empty b{display:block;font-size:17px;margin-bottom:6px;color:#ffbe0b}
.sk{height:120px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
/* ---- compact list while a video is playing ---- */
body.playing .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
body.playing .card{flex-direction:row;align-items:center;padding:8px 10px;border-radius:15px;gap:8px;contain-intrinsic-size:auto 56px;box-shadow:none}
body.playing .card-top,body.playing .btn{display:none}
body.playing .logo{width:38px;height:38px;border-radius:10px}
body.playing .flag{width:44px;height:30px;border-radius:6px}
body.playing .card h3{font-size:13.5px}
body.playing .card small{font-size:11px}
body.playing .cmain{flex:1;gap:9px}
body.playing .fv{width:28px;height:28px;font-size:12px}
body.playing .bar{margin:12px 0 8px;padding:8px 12px}
body.playing .bar h2{font-size:14px}
body.playing .sk{height:56px}
</style></head><body>
<header><div class="island">
  <div class="brand" id="home"><img src="https://i.ibb.co/RG9PVntv/file-000000006df082088ecfb45a4b842781.png" alt="Hrry TV"><b class="rbt">HRRY TV</b></div>
  <span id="count">LIVE TV</span>
</div></header>
<div class="promo"><div><span>⚡ Live HD</span><span>Live TV from every country • Recent channels are saved automatically</span></div></div>
<main>
  <section class="pwrap" id="pwrap">
    <div class="player" id="pl">
      <video id="v" controls playsinline webkit-playsinline preload="none"></video>
      <img id="wm" src="https://i.ibb.co/RG9PVntv/file-000000006df082088ecfb45a4b842781.png" alt="">
      <button type="button" class="um" id="um"><i class="fas fa-volume-high"></i><span>Tap to Unmute</span></button>
      <div class="ov" id="ov"></div>
    </div>
    <div class="tools">
      <div class="tt"><span id="np">Live TV</span><div class="sub"><span class="badge"><i></i>LIVE</span><span id="sc"></span></div></div>
      <div class="acts">
        <button class="pc" type="button" id="rl"><i class="fas fa-rotate-right"></i><span>Reload</span></button>
        <button class="pc" type="button" id="fs"><i class="fas fa-expand"></i></button>
      </div>
    </div>
  </section>
  <div id="view"></div>
</main>
<script>
(()=>{
const $=i=>document.getElementById(i),v=$('v'),ov=$('ov'),view=$('view');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(_){}}};
const api=async p=>{const r=await fetch(p);if(!r.ok)throw 0;return r.json()};
const TOP=['IN','US','GB','PK','BD','CA','AU','AE','SA','ID'],PAGE=60;
let countries=[],cache={},reg=[],cur=null,hls=null,hist=ls.get('hrry_hist',[]),favs=ls.get('hrry_favs',[]);
const flag=(c,w)=>'https://flagcdn.com/w'+(w||80)+'/'+c.toLowerCase()+'.png';
const cname=cc=>(countries.find(x=>x.c===cc)||{}).n||cc;
$('home').onclick=()=>{location.hash='/home'};

const overlay=h=>{ov.innerHTML=h;ov.classList.toggle('show',!!h)};
function mark(){view.querySelectorAll('[data-i]').forEach(e=>{const c=reg[e.dataset.i],s=cur&&c&&c.u===cur.u;e.classList.toggle('sel',!!s);const b=e.querySelector('.btn span');if(b)b.textContent=s?'NOW PLAYING':'WATCH LIVE'})}
function play(c,user=true){
  cur=c;$('pwrap').classList.add('on');document.body.classList.add('playing');
  $('np').textContent=c.n;$('sc').textContent=cname(c.cc)+' • '+c.g;
  hist=[c,...hist.filter(x=>x.u!==c.u)].slice(0,12);ls.set('hrry_hist',hist);
  overlay('<div class="spin"></div><b>LOADING LIVE TV…</b>');
  if(hls){hls.destroy();hls=null}
  try{v.pause();v.removeAttribute('src')}catch(_){}
  const fail=()=>overlay('<b>STREAM BUSY</b><p>Tap Reload or pick another channel.</p>');
  const go=()=>{if(user){v.muted=false;$('um').classList.remove('show')}
    v.play().then(()=>{overlay('');$('um').classList.toggle('show',v.muted)}).catch(()=>{v.muted=true;$('um').classList.add('show');v.play().then(()=>overlay('')).catch(()=>overlay(''))})};
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:20,maxMaxBufferLength:40,backBufferLength:10,lowLatencyMode:false});
    hls.loadSource(c.u);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,go);
    hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&(hls._r=(hls._r||0)+1)<4)hls.startLoad();
      else if(d.type===Hls.ErrorTypes.MEDIA_ERROR)hls.recoverMediaError();else fail()});
  }else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=c.u;v.onloadedmetadata=go;v.onerror=fail}else fail();
  mark();
}
v.addEventListener('playing',()=>overlay(''));
$('um').onclick=()=>{v.muted=false;v.volume=1;$('um').classList.remove('show');v.play().catch(()=>{})};
$('rl').onclick=()=>cur&&play(cur);
$('fs').onclick=()=>{const p=$('pl');if(document.fullscreenElement)document.exitFullscreen();else if(p.requestFullscreen)p.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()};

const ctyCard=(c,i)=>'<div class="card theme-'+(i%4)+'" data-c="'+esc(c.c)+'"><div class="card-top"><span class="pill"><i class="fas fa-flag"></i> '+esc(c.c)+'</span><span class="badge"><i></i>LIVE TV</span></div><div class="cmain"><img class="flag" loading="lazy" decoding="async" src="'+flag(c.c)+'" alt=""><div><h3>'+esc(c.n)+'</h3></div></div><button class="btn" type="button"><i class="fas fa-tv"></i><span>WATCH CHANNELS</span></button></div>';
function chCard(c,i){
  const k=reg.push(c)-1,f=favs.some(x=>x.u===c.u),s=cur&&cur.u===c.u;
  return '<div class="card theme-'+(i%4)+(s?' sel':'')+'" data-i="'+k+'"><div class="card-top"><span class="pill"><i class="fas fa-tv"></i> CH '+(i+1)+'</span><span class="badge"><i></i>LIVE</span></div><div class="cmain"><div class="logo">'+(c.l?'<img loading="lazy" decoding="async" src="'+esc(c.l)+'" alt="" onerror="this.remove()">':'<i class="fas fa-tv"></i>')+'</div><div><h3>'+esc(c.n)+'</h3><small>'+esc(c.g)+'</small></div><button class="fv'+(f?' on':'')+'" data-f="'+k+'" aria-label="Favorite"><i class="fa'+(f?'s':'r')+' fa-heart"></i></button></div><button class="btn" type="button"><i class="fas fa-play"></i><span>'+(s?'NOW PLAYING':'WATCH LIVE')+'</span></button></div>';
}
const sect=(t,ic,x)=>'<div class="bar"><h2><i class="fas '+ic+'"></i> '+t+'</h2>'+(x||'')+'</div>';
const skel='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';

function home(){
  reg=[];
  const top=TOP.map(c=>countries.find(x=>x.c===c)).filter(Boolean);
  let h=sect('Top Countries','fa-fire')+'<section class="grid">'+(top.length?top.map(ctyCard).join(''):skel)+'</section>';
  if(hist.length)h+=sect('Recently Played','fa-clock-rotate-left','<button class="pc" id="clr"><i class="fas fa-trash"></i> Clear</button>')+'<section class="grid">'+hist.map(chCard).join('')+'</section>';
  if(favs.length)h+=sect('Favorites','fa-heart')+'<section class="grid">'+favs.map(chCard).join('')+'</section>';
  h+='<button class="btn more" type="button" id="more"><i class="fas fa-earth-asia"></i><span>EXPLORE MORE COUNTRIES</span></button>';
  view.innerHTML=h;$('more').onclick=()=>{location.hash='/countries'};
  const b=$('clr');if(b)b.onclick=()=>{hist=[];ls.set('hrry_hist',hist);home()};
  $('count').textContent='LIVE TV';
}
function countriesView(){
  view.innerHTML=sect('All Countries','fa-earth-asia','<input id="cs" type="search" placeholder="Search country…">')+'<section class="grid" id="cg"></section>';
  const draw=()=>{const q=$('cs').value.trim().toLowerCase(),a=countries.filter(c=>!q||c.n.toLowerCase().includes(q));
    $('cg').innerHTML=a.length?a.map(ctyCard).join(''):'<div class="empty"><b>NO COUNTRY FOUND</b>Try another name.</div>';$('count').textContent=a.length+' COUNTRIES'};
  $('cs').oninput=draw;draw();
}
async function countryView(cc){
  cc=cc.toUpperCase();
  view.innerHTML='<div class="bar"><h2><img src="'+flag(cc,80)+'" alt=""> '+esc(cname(cc))+'</h2><input id="qs" type="search" placeholder="Search channels…"></div><section class="grid" id="chg">'+skel+'</section><button class="btn more" id="sm" type="button" style="display:none"><i class="fas fa-angles-down"></i><span>SHOW MORE</span></button>';
  let list=cache[cc];
  if(!list){try{list=(await api('/api/channels?c='+cc)).map(c=>({...c,cc}))}catch(_){list=null}
    if(location.hash.slice(1)!=='/country/'+cc)return;cache[cc]=list}
  let a=[],n=0;
  const more=()=>{const s=a.slice(n,n+PAGE);$('chg').insertAdjacentHTML('beforeend',s.map((c,j)=>chCard(c,n+j)).join(''));n+=s.length;$('sm').style.display=n<a.length?'flex':'none'};
  const draw=()=>{reg=[];n=0;const q=$('qs').value.trim().toLowerCase();
    if(!list){$('chg').innerHTML='<div class="empty"><b>UNABLE TO LOAD CHANNELS</b>Check your connection and try again.</div>';return}
    a=list.filter(c=>!q||(c.n+' '+c.g).toLowerCase().includes(q));
    $('count').textContent=a.length+' CHANNELS';
    $('chg').innerHTML=a.length?'':'<div class="empty"><b>NO CHANNELS FOUND</b>Nothing matched your search.</div>';
    if(a.length)more();else $('sm').style.display='none'};
  $('sm').onclick=more;
  let t;$('qs').oninput=()=>{clearTimeout(t);t=setTimeout(draw,200)};draw();
}
view.onclick=e=>{
  const f=e.target.closest('[data-f]');
  if(f){e.stopPropagation();const c=reg[f.dataset.f];favs=favs.some(x=>x.u===c.u)?favs.filter(x=>x.u!==c.u):[c,...favs];ls.set('hrry_favs',favs);
    const on=favs.some(x=>x.u===c.u);f.classList.toggle('on',on);f.innerHTML='<i class="fa'+(on?'s':'r')+' fa-heart"></i>';return}
  const i=e.target.closest('[data-i]');if(i)return play(reg[i.dataset.i]);
  const c=e.target.closest('[data-c]');if(c)location.hash='/country/'+c.dataset.c;
};
function route(){
  const h=location.hash.slice(1)||'/home';
  window.scrollTo(0,0);
  if(h.startsWith('/country/'))countryView(h.split('/')[2]||'');
  else if(h==='/countries')countriesView();
  else home();
}
window.addEventListener('hashchange',route);
(async()=>{try{countries=await api('/api/countries')}catch(_){}route()})();
})();
</script></body></html>
